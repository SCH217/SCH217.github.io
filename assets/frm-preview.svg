<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">FRM Workbench risk assessment schematic</title>
  <desc id="desc">A local portfolio risk report showing concentration, stress, liquidity, limits, and explicit unassessed areas.</desc>
  <rect width="1200" height="720" rx="36" fill="#10131d"/>
  <circle cx="1130" cy="120" r="240" fill="#2b234c" opacity=".5"/>
  <circle cx="86" cy="650" r="230" fill="#15343c" opacity=".38"/>

  <text x="66" y="70" fill="#f4f5fb" font-family="Arial, sans-serif" font-size="26" font-weight="700">FRM WORKBENCH</text>
  <text x="66" y="103" fill="#858ba0" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">LOCAL PORTFOLIO RISK DECISION SUPPORT</text>

  <g transform="translate(66 142)" font-family="Arial, sans-serif">
    <rect width="1068" height="80" rx="18" fill="#191e2b"/>
    <text x="26" y="33" fill="#9ca3b6" font-size="12">ASSESSMENT STATUS</text>
    <text x="26" y="58" fill="#f5f6fb" font-size="20" font-weight="700">PARTIAL ANALYSIS</text>
    <rect x="830" y="20" width="212" height="40" rx="20" fill="#342d55"/>
    <text x="936" y="45" fill="#c4b5fd" font-size="12" font-weight="700" text-anchor="middle">HUMAN REVIEW REQUIRED</text>
  </g>

  <g transform="translate(66 242)" font-family="Arial, sans-serif">
    <rect width="660" height="374" rx="22" fill="#181d2a"/>
    <text x="26" y="42" fill="#f5f6fb" font-size="18" font-weight="700">Risk domains</text>
    <text x="634" y="42" fill="#7e879b" font-size="12" text-anchor="end">valuation date · current</text>
    <line x1="26" y1="62" x2="634" y2="62" stroke="#2c3444"/>

    <g transform="translate(26 88)">
      <text x="0" y="0" fill="#a5adbd" font-size="13">Concentration</text>
      <text x="608" y="0" fill="#f5f6fb" font-size="14" font-weight="700" text-anchor="end">TRIGGERED</text>
      <rect y="18" width="608" height="10" rx="5" fill="#2a3140"/>
      <rect y="18" width="474" height="10" rx="5" fill="#f1b85b"/>
    </g>
    <g transform="translate(26 154)">
      <text x="0" y="0" fill="#a5adbd" font-size="13">Liquidity</text>
      <text x="608" y="0" fill="#f5f6fb" font-size="14" font-weight="700" text-anchor="end">ASSESSED</text>
      <rect y="18" width="608" height="10" rx="5" fill="#2a3140"/>
      <rect y="18" width="288" height="10" rx="5" fill="#63d7bd"/>
    </g>
    <g transform="translate(26 220)">
      <text x="0" y="0" fill="#a5adbd" font-size="13">Stress loss</text>
      <text x="608" y="0" fill="#f5f6fb" font-size="14" font-weight="700" text-anchor="end">ASSESSED</text>
      <rect y="18" width="608" height="10" rx="5" fill="#2a3140"/>
      <rect y="18" width="392" height="10" rx="5" fill="#8c82e8"/>
    </g>
    <g transform="translate(26 286)">
      <text x="0" y="0" fill="#a5adbd" font-size="13">Derivative sensitivities</text>
      <text x="608" y="0" fill="#f5f6fb" font-size="14" font-weight="700" text-anchor="end">NOT ASSESSED</text>
      <rect y="18" width="608" height="10" rx="5" fill="#2a3140"/>
      <rect y="18" width="112" height="10" rx="5" fill="#5f687a"/>
    </g>
  </g>

  <g transform="translate(752 242)" font-family="Arial, sans-serif">
    <rect width="382" height="176" rx="22" fill="#f2f4f8"/>
    <text x="24" y="38" fill="#202432" font-size="17" font-weight="700">Stress register</text>
    <text x="24" y="68" fill="#6b7280" font-size="12">Scenario</text>
    <text x="356" y="68" fill="#6b7280" font-size="12" text-anchor="end">Current-weight backcast</text>
    <line x1="24" y1="84" x2="356" y2="84" stroke="#d6dbe5"/>
    <text x="24" y="116" fill="#4b5563" font-size="13">Equity shock</text>
    <text x="356" y="116" fill="#202432" font-size="15" font-weight="700" text-anchor="end">review</text>
    <text x="24" y="148" fill="#4b5563" font-size="13">Rates + FX</text>
    <text x="356" y="148" fill="#202432" font-size="15" font-weight="700" text-anchor="end">review</text>
  </g>

  <g transform="translate(752 438)" font-family="Arial, sans-serif">
    <rect width="382" height="178" rx="22" fill="#191e2b"/>
    <text x="24" y="38" fill="#f5f6fb" font-size="17" font-weight="700">Method &amp; evidence</text>
    <g transform="translate(24 64)">
      <circle cx="6" cy="6" r="6" fill="#63d7bd"/>
      <text x="24" y="11" fill="#a5adbd" font-size="12">explicit data gates</text>
      <circle cx="6" cy="42" r="6" fill="#63d7bd"/>
      <text x="24" y="47" fill="#a5adbd" font-size="12">deterministic package</text>
      <circle cx="6" cy="78" r="6" fill="#63d7bd"/>
      <text x="24" y="83" fill="#a5adbd" font-size="12">no guessed values</text>
    </g>
  </g>

  <text x="66" y="664" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="14" font-weight="700">INPUT → METHOD → LIMIT → ACTION REGISTER</text>
  <text x="1134" y="664" fill="#777f92" font-family="Arial, sans-serif" font-size="12" text-anchor="end">Illustrative risk-report schematic</text>
</svg>
