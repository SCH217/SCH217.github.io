<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ReproFix evidence-first repair pipeline schematic</title>
  <desc id="desc">A bounded bug report becomes a frozen regression test, minimal patch, independent review, and draft pull request.</desc>
  <rect width="1200" height="720" rx="36" fill="#0a111c"/>
  <circle cx="1040" cy="82" r="220" fill="#252752" opacity=".52"/>
  <circle cx="100" cy="650" r="250" fill="#103037" opacity=".46"/>

  <text x="66" y="72" fill="#eef4ff" font-family="Arial, sans-serif" font-size="26" font-weight="700">REPROFIX</text>
  <text x="66" y="104" fill="#7f90a7" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">EVIDENCE-FIRST IOS BUG REPAIR</text>

  <g transform="translate(66 156)" font-family="Arial, sans-serif">
    <rect width="1068" height="92" rx="18" fill="#111d2c"/>
    <text x="26" y="34" fill="#8295ac" font-size="12">RUN</text>
    <text x="26" y="62" fill="#eef4ff" font-size="19" font-weight="700">myolog / exact base SHA</text>
    <rect x="830" y="24" width="212" height="44" rx="22" fill="#183f39"/>
    <text x="936" y="51" fill="#66e2c2" font-size="12" font-weight="700" text-anchor="middle">POLICY · VERIFIED</text>
  </g>

  <g transform="translate(66 292)" font-family="Arial, sans-serif">
    <g>
      <rect width="184" height="238" rx="20" fill="#141f2f"/>
      <circle cx="30" cy="34" r="10" fill="#65e1c1"/>
      <text x="52" y="39" fill="#edf4ff" font-size="15" font-weight="700">Report</text>
      <text x="24" y="78" fill="#7f91a8" font-size="12">bounded input</text>
      <rect x="24" y="98" width="136" height="8" rx="4" fill="#344258"/>
      <rect x="24" y="118" width="118" height="8" rx="4" fill="#344258"/>
      <rect x="24" y="138" width="128" height="8" rx="4" fill="#344258"/>
      <rect x="24" y="180" width="136" height="32" rx="16" fill="#1d3344"/>
      <text x="92" y="201" fill="#9db2c6" font-size="11" font-weight="700" text-anchor="middle">LEASED</text>
    </g>

    <path d="M198 119h36" stroke="#40526a" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M226 111l8 8-8 8" fill="none" stroke="#40526a" stroke-width="2"/>

    <g transform="translate(248)">
      <rect width="184" height="238" rx="20" fill="#141f2f"/>
      <circle cx="30" cy="34" r="10" fill="#f2b85b"/>
      <text x="52" y="39" fill="#edf4ff" font-size="15" font-weight="700">Regression</text>
      <text x="24" y="78" fill="#7f91a8" font-size="12">failure proven first</text>
      <rect x="24" y="102" width="136" height="72" rx="12" fill="#0d1723"/>
      <text x="38" y="128" fill="#f58f8f" font-size="11" font-family="Menlo, monospace">FAIL 1 / 1</text>
      <text x="38" y="151" fill="#9db2c6" font-size="10" font-family="Menlo, monospace">test_watch_recovery</text>
      <rect x="24" y="190" width="136" height="22" rx="11" fill="#3d3020"/>
      <text x="92" y="205" fill="#f2b85b" font-size="10" font-weight="700" text-anchor="middle">SHA-256 FROZEN</text>
    </g>

    <path d="M446 119h36" stroke="#40526a" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M474 111l8 8-8 8" fill="none" stroke="#40526a" stroke-width="2"/>

    <g transform="translate(496)">
      <rect width="184" height="238" rx="20" fill="#141f2f"/>
      <circle cx="30" cy="34" r="10" fill="#7d9df5"/>
      <text x="52" y="39" fill="#edf4ff" font-size="15" font-weight="700">Minimal patch</text>
      <text x="24" y="78" fill="#7f91a8" font-size="12">smallest candidate fix</text>
      <rect x="24" y="100" width="136" height="76" rx="12" fill="#0d1723"/>
      <text x="38" y="126" fill="#7d9df5" font-size="11" font-family="Menlo, monospace">+ 8 lines</text>
      <text x="38" y="149" fill="#f58f8f" font-size="11" font-family="Menlo, monospace">− 3 lines</text>
      <rect x="24" y="190" width="136" height="22" rx="11" fill="#1c354d"/>
      <text x="92" y="205" fill="#9ec1ff" font-size="10" font-weight="700" text-anchor="middle">FOCUSED TEST PASS</text>
    </g>

    <path d="M694 119h36" stroke="#40526a" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M722 111l8 8-8 8" fill="none" stroke="#40526a" stroke-width="2"/>

    <g transform="translate(744)">
      <rect width="184" height="238" rx="20" fill="#141f2f"/>
      <circle cx="30" cy="34" r="10" fill="#c49cf6"/>
      <text x="52" y="39" fill="#edf4ff" font-size="15" font-weight="700">Review</text>
      <text x="24" y="78" fill="#7f91a8" font-size="12">fresh independent pass</text>
      <rect x="24" y="100" width="136" height="34" rx="17" fill="#2b2540"/>
      <text x="92" y="122" fill="#d6baf9" font-size="10" font-weight="700" text-anchor="middle">POLICY CLEAR</text>
      <rect x="24" y="145" width="136" height="34" rx="17" fill="#1c354d"/>
      <text x="92" y="167" fill="#9ec1ff" font-size="10" font-weight="700" text-anchor="middle">EVIDENCE BOUND</text>
      <rect x="24" y="190" width="136" height="22" rx="11" fill="#183f39"/>
      <text x="92" y="205" fill="#66e2c2" font-size="10" font-weight="700" text-anchor="middle">APPROVED</text>
    </g>

    <path d="M942 119h36" stroke="#40526a" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M970 111l8 8-8 8" fill="none" stroke="#40526a" stroke-width="2"/>

    <g transform="translate(992)">
      <rect width="76" height="238" rx="20" fill="#65e1c1"/>
      <path d="M25 88h26M38 75v26" stroke="#09251f" stroke-width="3" stroke-linecap="round"/>
      <text transform="translate(45 208) rotate(-90)" fill="#09251f" font-size="12" font-weight="700" text-anchor="middle">DRAFT PR / PATCH</text>
    </g>
  </g>

  <text x="66" y="662" fill="#66e2c2" font-family="Arial, sans-serif" font-size="14" font-weight="700">REPORT → TEST → PATCH → REVIEW → EVIDENCE</text>
  <text x="1134" y="662" fill="#6f8198" font-family="Arial, sans-serif" font-size="12" text-anchor="end">Illustrative control-plane schematic</text>
</svg>
